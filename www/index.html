<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>PocketKit</title>
<link rel="stylesheet" href="css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("pk.theme")||'"auto"');document.documentElement.dataset.theme=(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <header class="top">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><h1>PocketKit</h1><p id="count" class="muted"></p></div></div>
      <button id="settingsBtn" class="round" aria-label="Settings">⚙︎</button>
    </header>
    <div class="finder"><input id="search" type="search" placeholder="Find a tool" autocomplete="off" aria-label="Find a tool"><button id="mic" class="round flat" aria-label="Search by voice" hidden>🎤</button></div>
    <div id="filters" class="chips" role="group" aria-label="Filter tools"></div>
    <div id="sections"></div>
  </section>
  <section id="tool" class="screen" hidden>
    <header class="bar"><button id="backBtn" class="round flat" aria-label="Back">←</button><h1 id="toolTitle" tabindex="-1"></h1><button id="pinBtn" class="round flat" aria-label="Pin tool">☆</button></header>
    <p id="toolDesc" class="tool-desc muted"></p>
    <div id="toolBody" class="tool-body"></div>
  </section>
  <section id="settings" class="screen" hidden>
    <header class="bar"><button id="setBack" class="round flat" aria-label="Back">←</button><h1 id="settingsTitle" tabindex="-1">Settings</h1></header>
    <div class="tool-body">
      <div class="card list"><div class="row"><b>PocketKit Pro</b><span id="proState" class="muted" style="text-align:right"></span></div><button class="btn" id="proOpen">See what Pro includes</button></div>
      <label class="f">Theme<select id="themeSel"><option value="auto">Follow the phone</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
      <div class="f">Colour<div class="swatches" id="accents"></div></div>
      <label class="item"><span class="grow">Haptic feedback</span><input id="hapticsChk" type="checkbox"></label>
      <div class="card list"><b>Backup</b><p class="muted" style="margin:0;font-size:13px">Saves your settings, notes, lists and other tool data to a file. Recordings, locked files and the Password Vault are not included.</p><div class="row"><button class="btn alt" id="backupBtn">Back up</button><button class="btn alt" id="restoreBtn">Restore</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden></div>
      <button class="btn alt" id="clearRecent">Clear recent tools</button>
      <button class="btn alt" id="clearPins">Clear pinned tools</button>
      <a class="btn alt linkbtn" href="privacy-policy.html">Privacy policy</a>
      <p class="muted center" id="about"></p>
    </div>
  </section>
</div>
<dialog id="proDlg"><div class="dlg">
  <h2>PocketKit Pro</h2><p id="proSub" class="muted" style="margin:0"></p>
  <ul id="proFeat" class="feat"></ul>
  <p id="proStatus" class="status" hidden></p>
  <button class="btn" id="proBuy">Unlock Pro</button><button class="btn alt" id="proRestore">Restore purchase</button>
  <div id="proCoupon"><label class="f">Have a trial code?<input id="proCode" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="PKT-XXXX-XXXX-XXXX-XXXX"></label><button class="btn alt" id="proRedeem" style="margin-top:8px;width:100%">Redeem code</button></div>
  <button class="btn alt" id="proClose">Not now</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="js/vendor/jsQR.js"></script>
<script src="js/core.js"></script>
<script src="js/coupons.js"></script>
<script src="js/pro.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/tools/timer.js"></script>
<script src="js/tools/calculator.js"></script>
<script src="js/tools/converter.js"></script>
<script src="js/tools/sensors.js"></script>
<script src="js/tools/location.js"></script>
<script src="js/tools/reminders.js"></script>
<script src="js/tools/device.js"></script>
<script src="js/tools/flashlight.js"></script>
<script src="js/tools/speech.js"></script>
<script src="js/tools/paint.js"></script>
<script src="js/tools/noise.js"></script>
<script src="js/tools/calc.js"></script>
<script src="js/tools/text.js"></script>
<script src="js/tools/audio.js"></script>
<script src="js/tools/camera.js"></script>
<script src="js/tools/measure.js"></script>
<script src="js/tools/health.js"></script>
<script src="js/tools/security.js"></script>
<script src="js/tools/daily.js"></script>
<script src="js/tools/fun.js"></script>
<script src="js/tools/more.js"></script>
<script src="js/tools/games2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
