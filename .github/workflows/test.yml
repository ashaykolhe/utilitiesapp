name: test
on:
  push:
    branches: [master]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: for f in www/js/*.js www/js/tools/*.js; do node --check "$f"; done
      - run: npm test
